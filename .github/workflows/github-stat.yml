name: Update Terminal Stats Card

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual execution from Actions tab

permissions:
  contents: write

jobs:
  build-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: jackhallloween21/jackhallloween21
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Create assets directory
        run: mkdir -p assets/images

      - name: Download SVG Terminal Stats Card
        run: |
          curl -s "https://github-stats-terminal-style-five.vercel.app/api/stats?username=jackhallloween21&theme=tokyonight&headerStyle=mac" -o assets/images/github_stats.svg

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images/github_stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update terminal stats card [skip ci]" && git push)
